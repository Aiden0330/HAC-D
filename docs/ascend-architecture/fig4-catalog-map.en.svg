</style><rect width="960" height="708.8000000000001" fill="var(--surface)" rx="8"/><text x="14" y="22.0" class="ttl">Figure 4 · Where the 18 hardware domains of the 54-event reference catalog sit in the Ascend architecture (FIT = interruptions per</text><text x="14" y="39.0" class="ttl">10⁹ card-hours, business-impact 口径; unit counts with the CloudMatrix384 geometry at 100k cards)</text><g transform="translate(0 17)"><text x="154" y="40" class="t2" style="font-weight:600;font-size:10.4px">① Catalog domain · FIT per card ·</text><text x="154" y="53" class="t2" style="font-weight:600;font-size:10.4px">rungs</text><text x="355" y="40" class="t2" style="font-weight:600;font-size:10.4px">② Unit counts at 100k cards</text><text x="556" y="40" class="t2" style="font-weight:600;font-size:10.4px">③ Fan-out and common cause (cards</text><text x="556" y="53" class="t2" style="font-weight:600;font-size:10.4px">stopped by one event)</text><text x="757" y="40" class="t2" style="font-weight:600;font-size:10.4px">④ First recovery that applies</text><text x="757" y="53" class="t2" style="font-weight:600;font-size:10.4px">(MindCluster / catalog)</text><rect x="14" y="61" width="126" height="129.2" rx="6" class="npu"/><text x="21" y="78.0" class="h">NPU chip and</text><text x="21" y="92.0" class="h">package</text><rect x="148" y="61" width="193" height="129.2" rx="6" class="npu" opacity="0.55"/><text x="154" y="76.0" class="s">CORE 466.7 · SRAM 166.7 · IOD</text><text x="154" y="88.8" class="s">200.0</text><text x="154" y="101.6" class="s">MEMT 400.0 · MEMP 173.3 (HBM)</text><text x="154" y="114.4" class="s">rungs: r/p/e/h (MEMP: p/e/P/h)</text><rect x="349" y="61" width="193" height="129.2" rx="6" class="npu" opacity="0.55"/><text x="355" y="76.0" class="s">100,000 NPUs = 200,000 dies</text><text x="355" y="88.8" class="s">800,000 HBM stacks (8 per NPU)</text><rect x="550" y="61" width="193" height="129.2" rx="6" class="npu" opacity="0.55"/><text x="556" y="76.0" class="s">1 card; in synchronous training any</text><text x="556" y="88.8" class="s">event stops the whole job</text><rect x="751" y="61" width="193" height="129.2" rx="6" class="npu" opacity="0.55"/><text x="757" y="76.0" class="s">transient: operator-level</text><text x="757" y="88.8" class="s">re-execution (HCCL re-execution ≈</text><text x="757" y="101.6" class="s">95 % success)</text><text x="757" y="114.4" class="s">on-chip memory UCE: isolate + step</text><text x="757" y="127.2" class="s">retry (process-level online</text><text x="757" y="140.0" class="s">recovery, off by default)</text><text x="757" y="152.8" class="s">persistent: process-level</text><text x="757" y="165.6" class="s">rescheduling (needs a standby</text><text x="757" y="178.4" class="s">server)</text><rect x="14" y="195.2" width="126" height="52.400000000000006" rx="6" class="npu"/><text x="21" y="212.2" class="h">Module / board</text><rect x="148" y="195.2" width="193" height="52.400000000000006" rx="6" class="npu" opacity="0.55"/><text x="154" y="210.2" class="s">MODULE 170.0 (HiAM module / board</text><text x="154" y="223.0" class="s">connection)</text><text x="154" y="235.8" class="s">rungs: p/e/P/h</text><rect x="349" y="195.2" width="193" height="52.400000000000006" rx="6" class="npu" opacity="0.55"/><text x="355" y="210.2" class="s">per card (catalog 口径)</text><rect x="550" y="195.2" width="193" height="52.400000000000006" rx="6" class="npu" opacity="0.55"/><text x="556" y="210.2" class="s">1 card; spread to the same board not</text><text x="556" y="223.0" class="s">public</text><rect x="751" y="195.2" width="193" height="52.400000000000006" rx="6" class="npu" opacity="0.55"/><text x="757" y="210.2" class="s">process-level rescheduling or hot</text><text x="757" y="223.0" class="s">swap (needs a spare); without spares,</text><text x="757" y="235.8" class="s">elastic scale-in</text><rect x="14" y="252.6" width="126" height="90.80000000000001" rx="6" class="cpu"/><text x="21" y="269.6" class="h">Node / chassis</text><rect x="148" y="252.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="154" y="267.6" class="s">CPU 166.7 · DDR 200.0 · SSD 166.7</text><text x="154" y="280.4" class="s">(p/e/P/h)</text><text x="154" y="293.2" class="s">NIC 100.0 (UB NIC / RoCE port,</text><text x="154" y="306.0" class="s">r/p/e/n/h)</text><text x="154" y="318.8" class="s">BOXIO 46.7 (in-chassis IO</text><text x="154" y="331.6" class="s">conversion / switch board, n)</text><rect x="349" y="252.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="355" y="267.6" class="s">12,500 nodes · 50,000 CPUs</text><text x="355" y="280.4" class="s">200,000 RDMA ports · 12,500</text><text x="355" y="293.2" class="s">Qingtian cards</text><rect x="550" y="252.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="556" y="267.6" class="s">8 cards (one node); BOXIO ≈ 373</text><text x="556" y="280.4" class="s">FIT per node, CPU ≈ 333 FIT per</text><text x="556" y="293.2" class="s">CPU (derived)</text><rect x="751" y="252.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="757" y="267.6" class="s">process-level rescheduling (replace</text><text x="757" y="280.4" class="s">the node); RoCE flaps &lt; 30 s are</text><text x="757" y="293.2" class="s">absorbed, re-execution after link</text><text x="757" y="306.0" class="s">failover</text><rect x="14" y="348.4" width="126" height="142" rx="6" class="ub"/><text x="21" y="365.4" class="h">UB fabric</text><text x="21" y="379.4" class="h">(scale-up)</text><rect x="148" y="348.4" width="193" height="142" rx="6" class="ub" opacity="0.55"/><text x="154" y="363.4" class="s">OPT 66.7 (optics / fibre protection</text><text x="154" y="376.2" class="s">group, after protection, r/n)</text><text x="154" y="389.0" class="s">FABRIC 66.7 (L1 / L2 interconnect</text><text x="154" y="401.8" class="s">devices, residual after protection,</text><text x="154" y="414.6" class="s">n)</text><rect x="349" y="348.4" width="193" height="142" rx="6" class="ub" opacity="0.55"/><text x="355" y="363.4" class="s">87,500 L1 + 29,232 L2 chips ·</text><text x="355" y="376.2" class="s">1,827 sub-planes</text><text x="355" y="389.0" class="s">1,400,000 L1–L2 links · 2,800,000</text><text x="355" y="401.8" class="s">link ends</text><rect x="550" y="348.4" width="193" height="142" rx="6" class="ub" opacity="0.55"/><text x="556" y="363.4" class="s">link / L2 chip: 1/16 of a sub-plane’s</text><text x="556" y="376.2" class="s">bandwidth (degraded); L1 chip: one</text><text x="556" y="389.0" class="s">node (8 cards)</text><text x="556" y="401.8" class="s">OPT ≈ 4.8 FIT per link, FABRIC ≈</text><text x="556" y="414.6" class="s">57 FIT per UB chip (derived)</text><rect x="751" y="348.4" width="193" height="142" rx="6" class="ub" opacity="0.55"/><text x="757" y="363.4" class="s">operator-level online recovery:</text><text x="757" y="376.2" class="s">re-execute after BGP switching (A3</text><text x="757" y="389.0" class="s">only)</text><text x="757" y="401.8" class="s">UB 2.0: 100-ns-level optical</text><text x="757" y="414.6" class="s">protection switching (950 on,</text><text x="757" y="427.4" class="s">vendor)</text><text x="757" y="440.2" class="s">compare: conventional module AFR 4‰</text><text x="757" y="453.0" class="s">≈ 457 FIT per module, a raw device</text><text x="757" y="465.8" class="s">rate before protection (different 口</text><text x="757" y="478.6" class="s">径)</text><rect x="14" y="495.4" width="126" height="78" rx="6" class="fac"/><text x="21" y="512.4" class="h">Cabinet / facility</text><rect x="148" y="495.4" width="193" height="78" rx="6" class="fac" opacity="0.55"/><text x="154" y="510.4" class="s">POWER 166.7 · COOL 100.0 · MGMT</text><text x="154" y="523.2" class="s">133.3</text><text x="154" y="536.0" class="s">cabinet power residual · liquid</text><text x="154" y="548.8" class="s">cooling / fans · management blade /</text><text x="154" y="561.6" class="s">BMC / UBM; no rung</text><rect x="349" y="495.4" width="193" height="78" rx="6" class="fac" opacity="0.55"/><text x="355" y="510.4" class="s">3,125 compute + 1,044 comm.</text><text x="355" y="523.2" class="s">cabinets (CM384)</text><text x="355" y="536.0" class="s">1,563 + 416 (Atlas 950 preset)</text><rect x="550" y="495.4" width="193" height="78" rx="6" class="fac" opacity="0.55"/><text x="556" y="510.4" class="s">compute cabinet 32 cards (950: 64);</text><text x="556" y="523.2" class="s">POWER ≈ 5,333 FIT per cabinet</text><text x="556" y="536.0" class="s">comm. cabinet: ≈ 28 L2 chips share it</text><text x="556" y="548.8" class="s">(sub-plane placement over the 4</text><text x="556" y="561.6" class="s">cabinets not public)</text><rect x="751" y="495.4" width="193" height="78" rx="6" class="fac" opacity="0.55"/><text x="757" y="510.4" class="s">no rung → global recovery (job-level</text><text x="757" y="523.2" class="s">rescheduling)</text><text x="757" y="536.0" class="s">handled by the redundancy level (1+1</text><text x="757" y="548.8" class="s">/ N+1) and a common-cause β ceiling</text><rect x="14" y="578.4" width="126" height="65.2" rx="6" class="vpc"/><text x="21" y="595.4" class="h">Cluster services</text><rect x="148" y="578.4" width="193" height="65.2" rx="6" class="vpc" opacity="0.55"/><text x="154" y="593.4" class="s">STORAGE 133.3 (shared checkpoint</text><text x="154" y="606.2" class="s">/ storage service)</text><text x="154" y="619.0" class="s">UNKNOWN 410.0 (software /</text><text x="154" y="631.8" class="s">unattributed)</text><rect x="349" y="578.4" width="193" height="65.2" rx="6" class="vpc" opacity="0.55"/><text x="355" y="593.4" class="s">shared by the cluster; at 100k</text><text x="355" y="606.2" class="s">cards STORAGE ≈ 0.013 and</text><text x="355" y="619.0" class="s">UNKNOWN ≈ 0.041 events per hour</text><rect x="550" y="578.4" width="193" height="65.2" rx="6" class="vpc" opacity="0.55"/><text x="556" y="593.4" class="s">the whole job</text><rect x="751" y="578.4" width="193" height="65.2" rx="6" class="vpc" opacity="0.55"/><text x="757" y="593.4" class="s">job-level rescheduling (default,</text><text x="757" y="606.2" class="s">slower with scale); UNKNOWN must be</text><text x="757" y="619.0" class="s">attributed before it can be</text><text x="757" y="631.8" class="s">allocated</text><text x="14" y="660.6" class="m">Rungs (per-event catalog flags): r replay · p process rescheduling · e DP elasticity · P predictive migration · n network fault tolerance · h hot swap. Conversions = catalog FIT per card</text><text x="14" y="673.2" class="m">× cards ÷ devices, assuming every event of the class originates in that device (derived, orientation only).</text></g></svg>