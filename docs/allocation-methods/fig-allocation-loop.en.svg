</style><rect width="960" height="384" fill="var(--surface)" rx="8"/><text x="14" y="20" class="ttl">The allocation loop: target → budget split → class budgets → two levers → bottom-up prediction and verification → reallocation</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink2)"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--s2)"/></marker></defs><rect x="14" y="36" width="176" height="98" rx="7" fill="var(--b1)" class="box"/><text x="22" y="52" class="h">① System target</text><text x="22" y="66" class="t2">A_op ≥ 98.5 % (30 days)</text><text x="22" y="80" class="t2">or G_d* (delivered), λ*</text><text x="22" y="94" class="t2">budget U = 1 − A*;</text><text x="22" y="108" class="t2">口径: same event class,</text><text x="22" y="122" class="t2">same denominator</text><rect x="202" y="36" width="176" height="140" rx="7" fill="var(--b2)" class="box"/><text x="210" y="52" class="h">② Budget split (methods)</text><text x="210" y="66" class="f">equal λ*/m</text><text x="210" y="80" class="f">ARINC wᵢ = λᵢ⁰/Σλ⁰</text><text x="210" y="94" class="f">(uniform factor)</text><text x="210" y="108" class="f">AGREE nᵢ/N ÷ (Eᵢ tᵢ)</text><text x="210" y="122" class="f">feasibility Π rᵢₖ ·</text><text x="210" y="136" class="f">Albert common level</text><text x="210" y="150" class="f">cost-optimal min Σ</text><text x="210" y="164" class="f">aᵢ(λᵢ⁰/λᵢ)^{bᵢ}</text><rect x="390" y="36" width="176" height="140" rx="7" fill="var(--b3)" class="box"/><text x="398" y="52" class="h">③ Class budgets</text><text x="398" y="66" class="f">ptᵢ* = U_free · wᵢ</text><text x="398" y="80" class="f">λᵢ* = ptᵢ*·3600/(A*·p̄ᵢ)</text><text x="398" y="94" class="f">kᵢ = λᵢ/λᵢ*; allowed FIT</text><text x="398" y="108" class="f">= current/kᵢ</text><text x="398" y="122" class="t2">stage budgets: detection /</text><text x="398" y="136" class="t2">auto / manual</text><text x="398" y="150" class="t2">silent: q*, D*; checkpoint:</text><text x="398" y="164" class="t2">τ bound</text><rect x="578" y="36" width="176" height="98" rx="7" fill="var(--b4)" class="box"/><text x="586" y="52" class="h">④a Hardware lever (λᵢ)</text><text x="586" y="66" class="t2">FIT acceptance limit per</text><text x="586" y="80" class="t2">class</text><text x="586" y="94" class="t2">H-RELIABILITY, H-LEMON</text><text x="586" y="108" class="t2">redundancy k-of-n, β common</text><text x="586" y="122" class="t2">cause</text><rect x="578" y="142" width="176" height="140" rx="7" fill="var(--b4)" class="box"/><text x="586" y="158" class="h">④b Mechanism lever (p̄ᵢ)</text><text x="586" y="172" class="t2">detection d, rungs s / tₛ,</text><text x="586" y="186" class="t2">stages 60/60/60</text><text x="586" y="200" class="t2">τ, δ; manual share;</text><text x="586" y="214" class="t2">coverage q</text><text x="586" y="228" class="t2">selection: exact ≤ 10 /</text><text x="586" y="242" class="t2">greedy / AGREE two-phase</text><text x="586" y="256" class="t2">derating −5 pt / −8 pt /</text><text x="586" y="270" class="t2">×1.5</text><rect x="766" y="36" width="176" height="182" rx="7" fill="var(--b3)" class="box"/><text x="774" y="52" class="h">⑤ Bottom-up prediction and</text><text x="774" y="66" class="h">verification</text><text x="774" y="80" class="t2">closed form: 27-path chain</text><text x="774" y="94" class="t2">→ p̄ᵢ → A_op</text><text x="774" y="108" class="t2">nine-line ledger →</text><text x="774" y="122" class="t2">delivered G_d</text><text x="774" y="136" class="t2">MC: 400 windows → P(window</text><text x="774" y="150" class="t2">≥ target)</text><text x="774" y="164" class="t2">Wilson interval → supported</text><text x="774" y="178" class="t2">/ uncertain</text><text x="774" y="192" class="t2">attribution: Shapley,</text><text x="774" y="206" class="t2">removed excess</text><path d="M190 80 L201 80" class="arrow" marker-end="url(#ah)"/><path d="M378 80 L389 80" class="arrow" marker-end="url(#ah)"/><path d="M566 72 L577 85" class="arrow" marker-end="url(#ah)"/><path d="M566 88 L577 212" class="arrow" marker-end="url(#ah)"/><path d="M754 85 L765 66" class="arrow" marker-end="url(#ah)"/><path d="M754 212 L765 188" class="arrow" marker-end="url(#ah)"/><path d="M875.12 218 L875.12 300 L478 300 L478 177" class="back" marker-end="url(#ah2)"/><text x="676.56" y="296" text-anchor="middle" class="t2">reallocate slack (water-filling) / iterate</text><path d="M832.88 218 L832.88 322 L102 322 L102 135" class="back" marker-end="url(#ah2)"/><text x="290" y="318" text-anchor="middle" class="t2">incidents → Garwood rates → write back (hacd rate)</text><rect x="14" y="334" width="932" height="40" rx="7" fill="var(--mid)"/><text x="480" y="351" text-anchor="middle" class="f" style="font-size:11px">Conservation: Σᵢ ptᵢ + non-domain pauses = 1 − A_op, ptᵢ = A_run · λᵢ · p̄ᵢ / 3600 — the method only changes the split between classes;</text><text x="480" y="366" text-anchor="middle" class="f" style="font-size:11px">hardware changes λᵢ, mechanisms change p̄ᵢ</text></svg>