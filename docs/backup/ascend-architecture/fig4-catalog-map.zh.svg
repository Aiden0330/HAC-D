</style><rect width="960" height="555.4" fill="var(--surface)" rx="8"/><text x="14" y="22.0" class="ttl">图 4 · 54 条事件参考目录的 18 个硬件域落在昇腾架构的哪一层（FIT = 每 10⁹ 卡·小时的中断事件，业务影响口径；单元数取 CloudMatrix384 几何、</text><text x="14" y="39.0" class="ttl">10 万卡）</text><g transform="translate(0 17)"><text x="154" y="40" class="t2" style="font-weight:600;font-size:10.4px">① 目录事件域 · FIT / 卡 · 梯级</text><text x="355" y="40" class="t2" style="font-weight:600;font-size:10.4px">② 单元数 @ 10 万卡</text><text x="556" y="40" class="t2" style="font-weight:600;font-size:10.4px">③ 扇出与共因（一次事件停掉多少卡）</text><text x="757" y="40" class="t2" style="font-weight:600;font-size:10.4px">④ 首先起作用的恢复（MindCluster /</text><text x="757" y="53" class="t2" style="font-weight:600;font-size:10.4px">目录）</text><rect x="14" y="61" width="126" height="78" rx="6" class="npu"/><text x="21" y="78.0" class="h">NPU 芯片与封装</text><rect x="148" y="61" width="193" height="78" rx="6" class="npu" opacity="0.55"/><text x="154" y="76.0" class="s">CORE 466.7 · SRAM 166.7 · IOD</text><text x="154" y="88.8" class="s">200.0</text><text x="154" y="101.6" class="s">MEMT 400.0 · MEMP 173.3（HBM）</text><text x="154" y="114.4" class="s">梯级：r/p/e/h（MEMP：p/e/P/h）</text><rect x="349" y="61" width="193" height="78" rx="6" class="npu" opacity="0.55"/><text x="355" y="76.0" class="s">100,000 NPU = 200,000 die</text><text x="355" y="88.8" class="s">800,000 个 HBM 堆栈（8 / NPU）</text><rect x="550" y="61" width="193" height="78" rx="6" class="npu" opacity="0.55"/><text x="556" y="76.0" class="s">1 卡；同步训练中任一事件都停住整个作</text><text x="556" y="88.8" class="s">业</text><rect x="751" y="61" width="193" height="78" rx="6" class="npu" opacity="0.55"/><text x="757" y="76.0" class="s">瞬态：算子级重执行（HCCL 重执行约</text><text x="757" y="88.8" class="s">95 % 成功）</text><text x="757" y="101.6" class="s">片上内存 UCE：隔离 + step 重试（进程</text><text x="757" y="114.4" class="s">级在线恢复，默认关）</text><text x="757" y="127.2" class="s">持久：进程级重调度（需备机）</text><rect x="14" y="144" width="126" height="39.6" rx="6" class="npu"/><text x="21" y="161.0" class="h">模组 / 板级</text><rect x="148" y="144" width="193" height="39.6" rx="6" class="npu" opacity="0.55"/><text x="154" y="159.0" class="s">MODULE 170.0（HiAM 模组 / 板级连接）</text><text x="154" y="171.8" class="s">梯级：p/e/P/h</text><rect x="349" y="144" width="193" height="39.6" rx="6" class="npu" opacity="0.55"/><text x="355" y="159.0" class="s">按卡计（目录口径）</text><rect x="550" y="144" width="193" height="39.6" rx="6" class="npu" opacity="0.55"/><text x="556" y="159.0" class="s">1 卡；同板波及未公开</text><rect x="751" y="144" width="193" height="39.6" rx="6" class="npu" opacity="0.55"/><text x="757" y="159.0" class="s">进程级重调度或热替换（需备机）；无备</text><text x="757" y="171.8" class="s">机时弹性缩容</text><rect x="14" y="188.6" width="126" height="90.80000000000001" rx="6" class="cpu"/><text x="21" y="205.6" class="h">节点 / 框内</text><rect x="148" y="188.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="154" y="203.6" class="s">CPU 166.7 · DDR 200.0 · SSD 166.7</text><text x="154" y="216.4" class="s">（p/e/P/h）</text><text x="154" y="229.2" class="s">NIC 100.0（UB 网卡 / RoCE 口，</text><text x="154" y="242.0" class="s">r/p/e/n/h）</text><text x="154" y="254.8" class="s">BOXIO 46.7（框内 IO 转换 / 交换板，</text><text x="154" y="267.6" class="s">n）</text><rect x="349" y="188.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="355" y="203.6" class="s">12,500 节点 · 50,000 CPU</text><text x="355" y="216.4" class="s">200,000 个 RDMA 口 · 12,500 张擎天</text><text x="355" y="229.2" class="s">卡</text><rect x="550" y="188.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="556" y="203.6" class="s">8 卡（一个节点）；折算 BOXIO ≈ 373</text><text x="556" y="216.4" class="s">FIT / 节点、CPU ≈ 333 FIT / 颗（推</text><text x="556" y="229.2" class="s">算）</text><rect x="751" y="188.6" width="193" height="90.80000000000001" rx="6" class="cpu" opacity="0.55"/><text x="757" y="203.6" class="s">进程级重调度（换节点）；RoCE 闪断 &lt;</text><text x="757" y="216.4" class="s">30 s 被吸收，链路倒换后重执行</text><rect x="14" y="284.4" width="126" height="90.80000000000001" rx="6" class="ub"/><text x="21" y="301.4" class="h">UB 互联（scale-up）</text><rect x="148" y="284.4" width="193" height="90.80000000000001" rx="6" class="ub" opacity="0.55"/><text x="154" y="299.4" class="s">OPT 66.7（光模块 / 光纤保护组，保护</text><text x="154" y="312.2" class="s">失效后，r/n）</text><text x="154" y="325.0" class="s">FABRIC 66.7（L1 / L2 互联设备，保</text><text x="154" y="337.8" class="s">护后残余，n）</text><rect x="349" y="284.4" width="193" height="90.80000000000001" rx="6" class="ub" opacity="0.55"/><text x="355" y="299.4" class="s">87,500 片 L1 + 29,232 片 L2 ·</text><text x="355" y="312.2" class="s">1,827 个子平面</text><text x="355" y="325.0" class="s">1,400,000 条 L1–L2 链路 ·</text><text x="355" y="337.8" class="s">2,800,000 个链路端</text><rect x="550" y="284.4" width="193" height="90.80000000000001" rx="6" class="ub" opacity="0.55"/><text x="556" y="299.4" class="s">链路 / L2 芯片：该子平面少 1/16 带宽</text><text x="556" y="312.2" class="s">（降级）；L1 芯片：1 个节点（8 卡）</text><text x="556" y="325.0" class="s">折算：OPT ≈ 4.8 FIT / 链路，FABRIC</text><text x="556" y="337.8" class="s">≈ 57 FIT / UB 芯片（推算）</text><rect x="751" y="284.4" width="193" height="90.80000000000001" rx="6" class="ub" opacity="0.55"/><text x="757" y="299.4" class="s">算子级在线恢复：BGP 切换后重执行（仅</text><text x="757" y="312.2" class="s">A3）</text><text x="757" y="325.0" class="s">UB 2.0：百纳秒级光路保护切换（950</text><text x="757" y="337.8" class="s">起，厂商）</text><text x="757" y="350.6" class="s">对照：传统光模块年失效率 4‰ ≈ 457</text><text x="757" y="363.4" class="s">FIT / 个，是保护前的器件率，口径不同</text><rect x="14" y="380.2" width="126" height="65.2" rx="6" class="fac"/><text x="21" y="397.2" class="h">机柜 / 设施</text><rect x="148" y="380.2" width="193" height="65.2" rx="6" class="fac" opacity="0.55"/><text x="154" y="395.2" class="s">POWER 166.7 · COOL 100.0 · MGMT</text><text x="154" y="408.0" class="s">133.3</text><text x="154" y="420.8" class="s">柜级供电残余 · 液冷 / 风扇 · 管理刀片</text><text x="154" y="433.6" class="s">/ BMC / UBM；无梯级</text><rect x="349" y="380.2" width="193" height="65.2" rx="6" class="fac" opacity="0.55"/><text x="355" y="395.2" class="s">3,125 计算柜 + 1,044 通信柜（CM384）</text><text x="355" y="408.0" class="s">1,563 + 416（Atlas 950 预设）</text><rect x="550" y="380.2" width="193" height="65.2" rx="6" class="fac" opacity="0.55"/><text x="556" y="395.2" class="s">计算柜 32 卡（950：64）；折算</text><text x="556" y="408.0" class="s">POWER ≈ 5,333 FIT / 柜</text><text x="556" y="420.8" class="s">通信柜：约 28 片 L2 共因（子平面在 4</text><text x="556" y="433.6" class="s">柜间的分布未公开）</text><rect x="751" y="380.2" width="193" height="65.2" rx="6" class="fac" opacity="0.55"/><text x="757" y="395.2" class="s">无梯级 → 全局恢复（作业级重调度）</text><text x="757" y="408.0" class="s">靠冗余等级（1+1 / N+1）与共因 β 上限</text><rect x="14" y="450.4" width="126" height="52.400000000000006" rx="6" class="vpc"/><text x="21" y="467.4" class="h">集群服务</text><rect x="148" y="450.4" width="193" height="52.400000000000006" rx="6" class="vpc" opacity="0.55"/><text x="154" y="465.4" class="s">STORAGE 133.3（共享 checkpoint /</text><text x="154" y="478.2" class="s">存储服务）</text><text x="154" y="491.0" class="s">UNKNOWN 410.0（软件 / 未归因）</text><rect x="349" y="450.4" width="193" height="52.400000000000006" rx="6" class="vpc" opacity="0.55"/><text x="355" y="465.4" class="s">整集群共享；10 万卡时 STORAGE 约</text><text x="355" y="478.2" class="s">0.013 次 / h、UNKNOWN 约 0.041 次</text><text x="355" y="491.0" class="s">/ h</text><rect x="550" y="450.4" width="193" height="52.400000000000006" rx="6" class="vpc" opacity="0.55"/><text x="556" y="465.4" class="s">整个作业</text><rect x="751" y="450.4" width="193" height="52.400000000000006" rx="6" class="vpc" opacity="0.55"/><text x="757" y="465.4" class="s">作业级重调度（默认，耗时随规模增长）；</text><text x="757" y="478.2" class="s">UNKNOWN 需先根因归类才能分配</text><text x="14" y="519.8" class="m">梯级（目录逐事件标记）：r 重执行 · p 进程重调度 · e DP 弹性 · P 预测迁移 · n 网络容错 · h 热替换。折算 = 目录每卡 FIT × 卡数 ÷ 器件数，假设该类事件全部出自该器件（推算，只作量级参考）。</text></g></svg>