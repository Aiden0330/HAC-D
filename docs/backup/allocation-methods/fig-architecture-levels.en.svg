 svg.viz .c { font-size: 10.2px; fill: var(--ink2); } svg.viz .rh { font-size: 11.5px; font-weight: 700; }</style><rect width="960" height="473.5" fill="var(--surface)" rx="8"/><text x="14" y="20" class="ttl">Architectural level → allocation inputs: unit count n_i, fan-out and common cause (importance E_i), available mechanisms (pause p̄_i), duty t_i → class budgets</text><text x="140" y="44" class="t2" style="font-weight:600;font-size:10.8px">① Units and counts n_i (100k</text><text x="140" y="57" class="t2" style="font-weight:600;font-size:10.8px">example)</text><text x="345" y="44" class="t2" style="font-weight:600;font-size:10.8px">② Fan-out and common cause</text><text x="345" y="57" class="t2" style="font-weight:600;font-size:10.8px">(source of E_i)</text><text x="550" y="44" class="t2" style="font-weight:600;font-size:10.8px">③ Mechanisms / redundancy at this</text><text x="550" y="57" class="t2" style="font-weight:600;font-size:10.8px">level</text><text x="755" y="44" class="t2" style="font-weight:600;font-size:10.8px">④ Consequence for the allocation</text><rect x="14" y="67" width="112" height="68" rx="6" fill="var(--b1)" class="box"/><text x="20" y="84" class="rh">Card / chip</text><rect x="134" y="67" width="197" height="68" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="140" y="82" class="c">CORE, SRAM, IOD, HBM, NIC,</text><text x="140" y="95.5" class="c">optics: 1–14 units per card</text><text x="140" y="109" class="c">100k cards = 100k units per class</text><rect x="339" y="67" width="197" height="68" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="345" y="82" class="c">synchronous training: any event</text><text x="345" y="95.5" class="c">stops the job</text><text x="345" y="109" class="c">fan-out 1 card; no common cause</text><rect x="544" y="67" width="197" height="68" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="550" y="82" class="c">replay, process rescheduling, DP</text><text x="550" y="95.5" class="c">elasticity, hot swap</text><text x="550" y="109" class="c">predictive migration,</text><text x="550" y="122.5" class="c">silent-corruption detection</text><rect x="749" y="67" width="197" height="68" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="755" y="82" class="c">most rungs: pause 264 → 5–60 s</text><text x="755" y="95.5" class="c">largest slack, reallocated</text><text x="755" y="109" class="c">upwards</text><rect x="14" y="141" width="112" height="54.5" rx="6" fill="var(--b2)" class="box"/><text x="20" y="158" class="rh">Node / server</text><rect x="134" y="141" width="197" height="54.5" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="140" y="156" class="c">CPU, DDR, SSD, BMC: 1 per node</text><text x="140" y="169.5" class="c">12,500 nodes (8 cards per node)</text><rect x="339" y="141" width="197" height="54.5" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="345" y="156" class="c">fan-out 8 cards (NVL72 tray 4)</text><text x="345" y="169.5" class="c">β: host PSU, batch firmware</text><text x="345" y="183" class="c">upgrades</text><rect x="544" y="141" width="197" height="54.5" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="550" y="156" class="c">process rescheduling, hot-spare</text><text x="550" y="169.5" class="c">nodes</text><text x="550" y="183" class="c">warm processes, runtime snapshots</text><rect x="749" y="141" width="197" height="54.5" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="755" y="156" class="c">box count shrinks the budget 8×</text><text x="755" y="169.5" class="c">exposure (card-hours) equals the</text><text x="755" y="183" class="c">card level</text><rect x="14" y="201.5" width="112" height="68" rx="6" fill="var(--b4)" class="box"/><text x="20" y="218.5" class="rh">Rack · supernode</text><text x="20" y="232.5" class="rh">· pod</text><rect x="134" y="201.5" width="197" height="68" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="140" y="216.5" class="c">switch trays, L1 / L2 chips, rack</text><text x="140" y="230" class="c">power</text><text x="140" y="243.5" class="c">391 racks; CloudMatrix384 = 261</text><text x="140" y="257" class="c">supernodes</text><rect x="339" y="201.5" width="197" height="68" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="345" y="216.5" class="c">fan-out 32–384 cards (NVL72: 72)</text><text x="345" y="230" class="c">β: busbar / manifold / OCS</text><text x="345" y="243.5" class="c">(TPUv4: OCS blast radius = pod)</text><rect x="544" y="201.5" width="197" height="68" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="550" y="216.5" class="c">elastic domain = spare</text><text x="550" y="230" class="c">granularity; N+k supernodes</text><text x="550" y="243.5" class="c">control-plane continuity, fabric</text><text x="550" y="257" class="c">reroute</text><rect x="749" y="201.5" width="197" height="68" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="755" y="216.5" class="c">exposure ∝ fan-out: domain</text><text x="755" y="230" class="c">classes gain weight</text><text x="755" y="243.5" class="c">spares 8.6 / 4.7 / 2.6 % (72 / 36</text><text x="755" y="257" class="c">/ 18-GPU blocks)</text><rect x="14" y="275.5" width="112" height="68" rx="6" fill="var(--b3)" class="box"/><text x="20" y="292.5" class="rh">Network planes ·</text><text x="20" y="306.5" class="rh">zones</text><rect x="134" y="275.5" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="140" y="290.5" class="c">planes 7–8, zones 7; 5,376</text><text x="140" y="304" class="c">optical links per supernode</text><text x="140" y="317.5" class="c">counted per plane / zone /</text><text x="140" y="331" class="c">optical_link</text><rect x="339" y="275.5" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="345" y="290.5" class="c">one plane lost = capacity</text><text x="345" y="304" class="c">(P−1)/P, no stop</text><text x="345" y="317.5" class="c">single ToR = single point; dual =</text><text x="345" y="331" class="c">parallel</text><rect x="544" y="275.5" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="550" y="290.5" class="c">multi-plane degrade</text><text x="550" y="304" class="c">(R-FABRIC-DEGRADE)</text><text x="550" y="317.5" class="c">fault-tolerant collectives</text><text x="550" y="331" class="c">(R-NETFAIL), link-local recovery</text><rect x="749" y="275.5" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="755" y="290.5" class="c">budget moves from downtime to</text><text x="755" y="304" class="c">slowdown</text><text x="755" y="317.5" class="c">ToR / plane limits become β and</text><text x="755" y="331" class="c">k-of-n limits</text><rect x="14" y="349.5" width="112" height="68" rx="6" fill="var(--b5)" class="box"/><text x="20" y="366.5" class="rh">Facility ·</text><text x="20" y="380.5" class="rh">storage · control</text><text x="20" y="394.5" class="rh">plane</text><rect x="134" y="349.5" width="197" height="68" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="140" y="364.5" class="c">2 power feeds, 6 CDU modules,</text><text x="140" y="378" class="c">storage per zone</text><text x="140" y="391.5" class="c">scheduler / framework = 1</text><rect x="339" y="349.5" width="197" height="68" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="345" y="364.5" class="c">fan-out = whole cluster or zone</text><text x="345" y="378" class="c">no published β (survey open</text><text x="345" y="391.5" class="c">problem)</text><rect x="544" y="349.5" width="197" height="68" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="550" y="364.5" class="c">2N / N+1 redundancy,</text><text x="550" y="378" class="c">ride-through; storage multipath</text><text x="550" y="391.5" class="c">root-cause attribution (UNKNOWN →</text><text x="550" y="405" class="c">governable classes)</text><rect x="749" y="349.5" width="197" height="68" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="755" y="364.5" class="c">no rung: still a hardware task</text><text x="755" y="378" class="c">after the plan</text><text x="755" y="391.5" class="c">allocate a β ceiling and a</text><text x="755" y="405" class="c">redundancy level, not a FIT</text><rect x="14" y="425.5" width="932" height="38" rx="7" fill="var(--mid)"/><text x="480" y="441.5" text-anchor="middle" class="f" style="font-size:10.8px">n_i unit count · E_i importance (share reaching the global recovery after the chain, pGlobal) · t_i duty (communication phases, save windows) · budget pt_i* =</text><text x="480" y="456.5" text-anchor="middle" class="f" style="font-size:10.8px">U_free · n_i E_i t_i / Σ_j n_j E_j t_j</text></svg>