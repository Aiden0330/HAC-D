</style><rect width="960" height="313" fill="var(--surface)" rx="8"/><text x="14" y="20" class="ttl">分配闭环：目标 → 预算拆分 → 类预算 → 两条杠杆 → 自底向上预测与校核 → 再分配</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink2)"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--s2)"/></marker></defs><rect x="14" y="36" width="176" height="84" rx="7" fill="var(--b1)" class="box"/><text x="22" y="52" class="h">① 系统目标</text><text x="22" y="66" class="t2">A_op ≥ 98.5 %（30 天）</text><text x="22" y="80" class="t2">或 G_d*（正确交付）、λ*</text><text x="22" y="94" class="t2">预算 U = 1 − A*；</text><text x="22" y="108" class="t2">口径：同类事件、同分母</text><rect x="202" y="36" width="176" height="126" rx="7" fill="var(--b2)" class="box"/><text x="210" y="52" class="h">② 预算拆分（方法）</text><text x="210" y="66" class="f">等分 λ*/m</text><text x="210" y="80" class="f">ARINC wᵢ = λᵢ⁰/Σλ⁰（等比）</text><text x="210" y="94" class="f">AGREE nᵢ/N ÷ (Eᵢ tᵢ)</text><text x="210" y="108" class="f">可改进性 Π rᵢₖ · Albert</text><text x="210" y="122" class="f">共同水平</text><text x="210" y="136" class="f">成本最优 min Σ</text><text x="210" y="150" class="f">aᵢ(λᵢ⁰/λᵢ)^{bᵢ}</text><rect x="390" y="36" width="176" height="126" rx="7" fill="var(--b3)" class="box"/><text x="398" y="52" class="h">③ 类预算</text><text x="398" y="66" class="f">ptᵢ* = U_free · wᵢ</text><text x="398" y="80" class="f">λᵢ* = ptᵢ*·3600/(A*·p̄ᵢ)</text><text x="398" y="94" class="f">kᵢ = λᵢ/λᵢ*；允许 FIT =</text><text x="398" y="108" class="f">当前/kᵢ</text><text x="398" y="122" class="t2">阶段预算：检测 / 自动 / 人工</text><text x="398" y="136" class="t2">静默：q*、D*；checkpoint：τ</text><text x="398" y="150" class="t2">上界</text><rect x="578" y="36" width="176" height="70" rx="7" fill="var(--b4)" class="box"/><text x="586" y="52" class="h">④a 硬件杠杆（改 λᵢ）</text><text x="586" y="66" class="t2">每类 FIT 验收限值</text><text x="586" y="80" class="t2">H-RELIABILITY、H-LEMON</text><text x="586" y="94" class="t2">冗余 k-of-n、β 共因</text><rect x="578" y="114" width="176" height="112" rx="7" fill="var(--b4)" class="box"/><text x="586" y="130" class="h">④b 机制杠杆（改 p̄ᵢ）</text><text x="586" y="144" class="t2">检测 d、梯级 s / tₛ、阶段</text><text x="586" y="158" class="t2">60/60/60</text><text x="586" y="172" class="t2">τ、δ；人工份额；覆盖率 q</text><text x="586" y="186" class="t2">选集：精确 ≤ 10 / 贪心 /</text><text x="586" y="200" class="t2">AGREE 两阶段</text><text x="586" y="214" class="t2">降额 −5 pt / −8 pt / ×1.5</text><rect x="766" y="36" width="176" height="126" rx="7" fill="var(--b3)" class="box"/><text x="774" y="52" class="h">⑤ 自底向上预测与校核</text><text x="774" y="66" class="t2">闭式：27 路径链 → p̄ᵢ → A_op</text><text x="774" y="80" class="t2">账本九项 → 正确交付 G_d</text><text x="774" y="94" class="t2">MC：400 窗口 → P(窗口 ≥</text><text x="774" y="108" class="t2">目标)</text><text x="774" y="122" class="t2">Wilson 区间 → supported /</text><text x="774" y="136" class="t2">uncertain</text><text x="774" y="150" class="t2">归因：Shapley、消除的超预算量</text><path d="M190 80 L201 80" class="arrow" marker-end="url(#ah)"/><path d="M378 80 L389 80" class="arrow" marker-end="url(#ah)"/><path d="M566 72 L577 71" class="arrow" marker-end="url(#ah)"/><path d="M566 88 L577 170" class="arrow" marker-end="url(#ah)"/><path d="M754 71 L765 66" class="arrow" marker-end="url(#ah)"/><path d="M754 170 L765 132" class="arrow" marker-end="url(#ah)"/><path d="M875.12 162 L875.12 244 L478 244 L478 163" class="back" marker-end="url(#ah2)"/><text x="676.56" y="240" text-anchor="middle" class="t2">再分配余量（注水）/ 迭代</text><path d="M832.88 162 L832.88 266 L102 266 L102 121" class="back" marker-end="url(#ah2)"/><text x="290" y="262" text-anchor="middle" class="t2">实测 → Garwood 率 → 回写（hacd rate）</text><rect x="14" y="278" width="932" height="25" rx="7" fill="var(--mid)"/><text x="480" y="295" text-anchor="middle" class="f" style="font-size:11px">守恒：Σᵢ ptᵢ + 非域暂停项 = 1 − A_op，ptᵢ = A_run · λᵢ · p̄ᵢ / 3600 —— 方法只改变类之间的拆分；硬件改 λᵢ，机制改 p̄ᵢ</text></svg>