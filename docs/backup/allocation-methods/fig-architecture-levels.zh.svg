<svg class="viz" id="fig-arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 391.5" width="100%" role="img" aria-label="架构层级 → 分配输入：单元数 n_i、扇出与共因（重要度 E_i）、可用机制（停顿 p̄_i）、工时比 t_i → 各类预算"><style>
svg.viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --mid:#f0efec; --b1:#e8f0fb; --b2:#fdece4; --b3:#e4f6ee; --b4:#fdf3dc; --b5:#f0efec; font-family:system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
@media (prefers-color-scheme: dark) { svg.viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --mid:#383835; --b1:#1f2d44; --b2:#3d2619; --b3:#1b3328; --b4:#3a2f17; --b5:#2a2a28; } }
:root[data-theme="light"] svg.viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --mid:#f0efec; --b1:#e8f0fb; --b2:#fdece4; --b3:#e4f6ee; --b4:#fdf3dc; --b5:#f0efec; }
:root[data-theme="dark"] svg.viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --mid:#383835; --b1:#1f2d44; --b2:#3d2619; --b3:#1b3328; --b4:#3a2f17; --b5:#2a2a28; }
svg.viz text { fill: var(--ink); font-size: 11.5px; } svg.viz .h { font-size: 12.5px; font-weight: 700; } svg.viz .t2 { fill: var(--ink2); font-size: 10.5px; } svg.viz .m { fill: var(--muted); font-size: 10px; } svg.viz .f { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; } svg.viz .ttl { font-size: 13px; font-weight: 600; }
svg.viz .box { stroke: var(--axis); stroke-width: 1; } svg.viz .arrow { stroke: var(--ink2); stroke-width: 1.6; fill: none; } svg.viz .back { stroke: var(--s2); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
 svg.viz .c { font-size: 10.2px; fill: var(--ink2); } svg.viz .rh { font-size: 11.5px; font-weight: 700; }</style><rect width="960" height="391.5" fill="var(--surface)" rx="8"/><text x="14" y="20" class="ttl">架构层级 → 分配输入：单元数 n_i、扇出与共因（重要度 E_i）、可用机制（停顿 p̄_i）、工时比 t_i → 各类预算</text><text x="140" y="44" class="t2" style="font-weight:600;font-size:10.8px">① 单元与计数 n_i（10 万卡示例）</text><text x="345" y="44" class="t2" style="font-weight:600;font-size:10.8px">② 扇出与共因（E_i 的来源）</text><text x="550" y="44" class="t2" style="font-weight:600;font-size:10.8px">③ 该层级可用的机制 / 冗余</text><text x="755" y="44" class="t2" style="font-weight:600;font-size:10.8px">④ 对分配的后果</text><rect x="14" y="54" width="112" height="54.5" rx="6" fill="var(--b1)" class="box"/><text x="20" y="71" class="rh">卡 / 芯片</text><rect x="134" y="54" width="197" height="54.5" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="140" y="69" class="c">CORE、SRAM、IOD、HBM、NIC、光模块</text><text x="140" y="82.5" class="c">：每卡 1–14 个单元</text><text x="140" y="96" class="c">10 万卡 = 10 万单元 / 类</text><rect x="339" y="54" width="197" height="54.5" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="345" y="69" class="c">同步训练：任一事件停整个作业</text><text x="345" y="82.5" class="c">扇出 1 卡；无共因</text><rect x="544" y="54" width="197" height="54.5" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="550" y="69" class="c">重执行、进程重调度、DP 弹性、热替换</text><text x="550" y="82.5" class="c">预测迁移、静默错误检测</text><rect x="749" y="54" width="197" height="54.5" rx="6" fill="var(--b1)" class="box" opacity="0.75"/><text x="755" y="69" class="c">梯级最多：停顿 264 → 5–60 s</text><text x="755" y="82.5" class="c">预算余量最大，再分配给上层</text><rect x="14" y="114.5" width="112" height="41" rx="6" fill="var(--b2)" class="box"/><text x="20" y="131.5" class="rh">节点 / 服务器</text><rect x="134" y="114.5" width="197" height="41" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="140" y="129.5" class="c">CPU、DDR、SSD、BMC：每节点 1 个</text><text x="140" y="143" class="c">12,500 节点（8 卡 / 节点）</text><rect x="339" y="114.5" width="197" height="41" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="345" y="129.5" class="c">扇出 8 卡（NVL72 托盘 4 卡）</text><text x="345" y="143" class="c">β：主机电源、固件批量升级</text><rect x="544" y="114.5" width="197" height="41" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="550" y="129.5" class="c">进程重调度、热备节点</text><text x="550" y="143" class="c">预热进程、运行时快照</text><rect x="749" y="114.5" width="197" height="41" rx="6" fill="var(--b2)" class="box" opacity="0.75"/><text x="755" y="129.5" class="c">按箱数计预算缩小 8 倍</text><text x="755" y="143" class="c">按暴露量（卡·小时）计与卡级相同</text><rect x="14" y="161.5" width="112" height="54.5" rx="6" fill="var(--b4)" class="box"/><text x="20" y="178.5" class="rh">机柜 · 超节点 ·</text><text x="20" y="192.5" class="rh">Pod</text><rect x="134" y="161.5" width="197" height="54.5" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="140" y="176.5" class="c">交换托盘、L1 / L2 芯片、机柜供电</text><text x="140" y="190" class="c">391 机柜；CloudMatrix384 = 261</text><text x="140" y="203.5" class="c">超节点</text><rect x="339" y="161.5" width="197" height="54.5" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="345" y="176.5" class="c">扇出 32–384 卡（NVL72 72 卡）</text><text x="345" y="190" class="c">β：母线 / manifold /</text><text x="345" y="203.5" class="c">OCS（TPUv4：OCS 爆炸半径 = pod）</text><rect x="544" y="161.5" width="197" height="54.5" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="550" y="176.5" class="c">弹性域 = 备件粒度；N+k 超节点</text><text x="550" y="190" class="c">控制面连续、网络绕行</text><rect x="749" y="161.5" width="197" height="54.5" rx="6" fill="var(--b4)" class="box" opacity="0.75"/><text x="755" y="176.5" class="c">暴露量 ∝ 扇出：域级类权重放大</text><text x="755" y="190" class="c">备件 8.6 / 4.7 / 2.6 %（72 / 36 /</text><text x="755" y="203.5" class="c">18 卡块）</text><rect x="14" y="222" width="112" height="68" rx="6" fill="var(--b3)" class="box"/><text x="20" y="239" class="rh">网络平面 · 分区</text><rect x="134" y="222" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="140" y="237" class="c">平面 7–8，分区 7；光链路 5,376 /</text><text x="140" y="250.5" class="c">超节点</text><text x="140" y="264" class="c">按 plane / zone / optical_link</text><text x="140" y="277.5" class="c">计数</text><rect x="339" y="222" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="345" y="237" class="c">丢一面 = 容量 (P−1)/P，不停机</text><text x="345" y="250.5" class="c">ToR 单上联 = 单点；双上联 = 并联</text><rect x="544" y="222" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="550" y="237" class="c">多平面降级（R-FABRIC-DEGRADE）</text><text x="550" y="250.5" class="c">容错集合通信（R-NETFAIL）、链路本地</text><text x="550" y="264" class="c">恢复</text><rect x="749" y="222" width="197" height="68" rx="6" fill="var(--b3)" class="box" opacity="0.75"/><text x="755" y="237" class="c">预算从停机行移到降速行</text><text x="755" y="250.5" class="c">ToR / 平面的限值变成 β 与 k-of-n</text><text x="755" y="264" class="c">限值</text><rect x="14" y="296" width="112" height="54.5" rx="6" fill="var(--b5)" class="box"/><text x="20" y="313" class="rh">机房设施 · 存储 ·</text><text x="20" y="327" class="rh">控制面</text><rect x="134" y="296" width="197" height="54.5" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="140" y="311" class="c">供电馈线 2 条、CDU 6</text><text x="140" y="324.5" class="c">模块、存储节点按分区</text><text x="140" y="338" class="c">调度器 / 框架 = 1</text><rect x="339" y="296" width="197" height="54.5" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="345" y="311" class="c">扇出 = 整集群或整分区</text><text x="345" y="324.5" class="c">β 无公开值（综述开放问题）</text><rect x="544" y="296" width="197" height="54.5" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="550" y="311" class="c">2N / N+1 冗余、穿越；存储多路径</text><text x="550" y="324.5" class="c">根因归类（UNKNOWN → 可治理类）</text><rect x="749" y="296" width="197" height="54.5" rx="6" fill="var(--b5)" class="box" opacity="0.75"/><text x="755" y="311" class="c">无梯级：方案后仍是硬件任务</text><text x="755" y="324.5" class="c">分配给 β 上限与冗余等级，而非 FIT</text><rect x="14" y="358.5" width="932" height="23" rx="7" fill="var(--mid)"/><text x="480" y="374.5" text-anchor="middle" class="f" style="font-size:10.8px">n_i 单元数 · E_i 重要度（链后到达全局恢复的份额 pGlobal）· t_i 工时比（通信相、保存窗口）· 预算 pt_i* = U_free · n_i E_i t_i / Σ_j n_j E_j t_j</text></svg>