</style><rect width="1111" height="190" fill="var(--surface)" rx="8"/><text x="14" y="20" class="ttl">Figure 0 · One strategy run</text><rect x="14" y="34" width="165" height="108" rx="8" class="bx"/><text x="26" y="54" style="font-weight:600">Design</text><text x="26" y="78" class="t2">topology template + N</text><text x="26" y="99" class="t2">FIT per unit</text><text x="26" y="120" class="t2">six default mechanisms</text><line x1="182" x2="195" y1="88" y2="88" class="arr"/><path d="M193 83 L200 88 L193 93 Z" class="arrh"/><rect x="203" y="34" width="191" height="108" rx="8" class="bx"/><text x="215" y="54" style="font-weight:600">Evaluate</text><text x="215" y="78" class="t2">A_op and delivered goodput</text><text x="215" y="99" class="t2">nominal and derated</text><text x="215" y="120" class="t2">cᵢ = λᵢ·p̄ᵢ, budget B</text><line x1="397" x2="410" y1="88" y2="88" class="arr"/><path d="M408 83 L415 88 L408 93 Z" class="arrh"/><rect x="418" y="34" width="204" height="108" rx="8" class="bx"/><text x="430" y="54" style="font-weight:600">Pick moves by strategy</text><text x="430" y="78" class="t2">library mechanisms</text><text x="430" y="99" class="t2">recovery levers to limits</text><text x="430" y="120" class="t2">optimal / MTTR- / MTTF-first</text><line x1="625" x2="638" y1="88" y2="88" class="arr"/><path d="M636 83 L643 88 L636 93 Z" class="arrh"/><rect x="646" y="34" width="223" height="108" rx="8" class="bxa"/><text x="658" y="54" style="font-weight:600">Hardware closure (level L)</text><text x="658" y="78" class="t2">xᵢcᵢ = clamp(wᵢL, floorᵢcᵢ, cᵢ)</text><text x="658" y="99" class="t2">L by bisection</text><text x="658" y="120" class="t2">effort Σ eᵢ log₂(1/xᵢ)</text><line x1="872" x2="885" y1="88" y2="88" class="arr"/><path d="M883 83 L890 88 L883 93 Z" class="arrh"/><rect x="893" y="34" width="204" height="108" rx="8" class="bx"/><text x="905" y="54" style="font-weight:600">Result</text><text x="905" y="78" class="t2">nominal and derated ≥ target</text><text x="905" y="99" class="t2">allowed FIT, total effort</text><text x="905" y="120" class="t2">slack, or infeasible</text><path d="M757.5 144 V160 H520 V151" class="arr"/><path d="M515 152 L520 144 L525 152 Z" class="arrh"/><text x="520" y="176" class="m">MTTF-first: floors not enough → add mechanisms, then relax the hardware</text></svg>