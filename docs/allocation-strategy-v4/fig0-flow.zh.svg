<svg class="viz" id="fig-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" role="img" aria-label="一次策略计算的流程"><style>
svg.viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --ghost:#e4e2dc; --acc:#2f4fb8; --box:#f2f1ec; font-family:system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) svg.viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ghost:#34342f; --acc:#9cb0ef; --box:#242421; } }
:root[data-theme="dark"] svg.viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ghost:#34342f; --acc:#9cb0ef; --box:#242421; }
svg.viz text { fill: var(--ink); font-size: 12px; } svg.viz .t2 { fill: var(--ink2); font-size: 11.5px; } svg.viz .m { fill: var(--muted); font-size: 11px; } svg.viz .tick { font-variant-numeric: tabular-nums; } svg.viz .ttl { font-size: 13px; font-weight: 600; } svg.viz .lab { font-size: 11px; }
svg.viz .grid { stroke: var(--grid); stroke-width: 1; } svg.viz .axis { stroke: var(--axis); stroke-width: 1; } svg.viz .ref { stroke: var(--ink2); stroke-width: 1.5; } svg.viz .hit { fill: transparent; pointer-events: all; }
svg.viz .bx { fill: var(--box); stroke: var(--axis); } svg.viz .bxa { fill: var(--box); stroke: var(--acc); stroke-width: 1.5; } svg.viz .arr { stroke: var(--ink2); stroke-width: 1.4; fill: none; } svg.viz .arrh { fill: var(--ink2); }
</style><rect width="960" height="190" fill="var(--surface)" rx="8"/><text x="14" y="20" class="ttl">图 0 · 一次策略计算</text><rect x="14" y="34" width="128" height="108" rx="8" class="bx"/><text x="26" y="54" style="font-weight:600">设计</text><text x="26" y="78" class="t2">拓扑模板 + 规模 N</text><text x="26" y="99" class="t2">各单元故障 FIT</text><text x="26" y="120" class="t2">默认六项机制</text><line x1="145" x2="161.5" y1="88" y2="88" class="arr"/><path d="M159.5 83 L166.5 88 L159.5 93 Z" class="arrh"/><rect x="169.5" y="34" width="144" height="108" rx="8" class="bx"/><text x="181.5" y="54" style="font-weight:600">评估</text><text x="181.5" y="78" class="t2">A_op 与正确有效产出</text><text x="181.5" y="99" class="t2">名义与降额两套参数</text><text x="181.5" y="120" class="t2">cᵢ = λᵢ·p̄ᵢ，预算 B</text><line x1="316.5" x2="333" y1="88" y2="88" class="arr"/><path d="M331 83 L338 88 L331 93 Z" class="arrh"/><rect x="341" y="34" width="169" height="108" rx="8" class="bx"/><text x="353" y="54" style="font-weight:600">按策略选择手段</text><text x="353" y="78" class="t2">机制（库参数）</text><text x="353" y="99" class="t2">恢复杠杆推到上限</text><text x="353" y="120" class="t2">最优 / MTTR / MTTF 优先</text><line x1="513" x2="529.5" y1="88" y2="88" class="arr"/><path d="M527.5 83 L534.5 88 L527.5 93 Z" class="arrh"/><rect x="537.5" y="34" width="223" height="108" rx="8" class="bxa"/><text x="549.5" y="54" style="font-weight:600">硬件闭合（水位 L）</text><text x="549.5" y="78" class="t2">xᵢcᵢ = clamp(wᵢL, floorᵢcᵢ, cᵢ)</text><text x="549.5" y="99" class="t2">L 由引擎二分</text><text x="549.5" y="120" class="t2">工作量 Σ eᵢ log₂(1/xᵢ)</text><line x1="763.5" x2="780" y1="88" y2="88" class="arr"/><path d="M778 83 L785 88 L778 93 Z" class="arrh"/><rect x="788" y="34" width="158" height="108" rx="8" class="bx"/><text x="800" y="54" style="font-weight:600">结果</text><text x="800" y="78" class="t2">名义与降额都 ≥ 目标</text><text x="800" y="99" class="t2">各类允许 FIT、总工作量</text><text x="800" y="120" class="t2">余量，或不可行</text><path d="M649 144 V160 H425.5 V151" class="arr"/><path d="M420.5 152 L425.5 144 L430.5 152 Z" class="arrh"/><text x="425.5" y="176" class="m">MTTF 优先：硬件到下限仍不够 → 先加机制，再放宽硬件</text></svg>