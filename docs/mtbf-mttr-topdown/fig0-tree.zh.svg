<svg class="viz" id="fig-tree" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" role="img" aria-label="自顶向下分解"><style>
svg.viz { --on-detect:#ffffff; --on-local:#0b0b0b; --on-auto:#0b0b0b; --on-manual:#0b0b0b; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --band:#e9e7e1; --ok:#eef4ec; --acc:#2f4fb8; --box:#f2f1ec; font-family:system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) svg.viz { --on-detect:#ffffff; --on-local:#ffffff; --on-auto:#ffffff; --on-manual:#ffffff; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --band:#34342f; --ok:#1f2a20; --acc:#9cb0ef; --box:#242421; } }
:root[data-theme="dark"] svg.viz { --on-detect:#ffffff; --on-local:#ffffff; --on-auto:#ffffff; --on-manual:#ffffff; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --band:#34342f; --ok:#1f2a20; --acc:#9cb0ef; --box:#242421; }
svg.viz text { fill: var(--ink); font-size: 12px; } svg.viz .t2 { fill: var(--ink2); font-size: 11.5px; } svg.viz .m { fill: var(--muted); font-size: 11px; } svg.viz .tick { font-variant-numeric: tabular-nums; } svg.viz .ttl { font-size: 13px; font-weight: 600; } svg.viz .lab { font-size: 11px; } svg.viz .b { font-weight: 600; }
svg.viz .grid { stroke: var(--grid); stroke-width: 1; } svg.viz .axis { stroke: var(--axis); stroke-width: 1; } svg.viz .hit { fill: transparent; pointer-events: all; }
svg.viz .bx { fill: var(--box); stroke: var(--axis); } svg.viz .bxa { fill: var(--box); stroke: var(--acc); stroke-width: 1.5; } svg.viz .arr { stroke: var(--ink2); stroke-width: 1.3; fill: none; } svg.viz .arrh { fill: var(--ink2); }
svg.viz .dash { stroke: var(--ink2); stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
</style><rect width="960" height="300" fill="var(--surface)" rx="8"/><text x="14" y="20" class="ttl">图 0 · 自顶向下：目标 → 各事件类的 MTBF / MTTR → 硬件单元的 MTBF 与机制的 MTTR</text><rect x="280" y="34" width="400" height="58" rx="8" class="bxa"/><text x="290" y="52" class="b">作业可用度 A_op（30 天窗口）</text><text x="290" y="71" class="t2">A_op = (1 − φ_SDC) / (1 + MTTR_hw/MTBF_hw + Σₖ MTTRₖ/MTBFₖ)</text><rect x="14" y="122" width="300" height="58" rx="8" class="bx"/><text x="24" y="140" class="b">硬件中断：MTBF_hw</text><text x="24" y="159" class="t2">1/MTBF_hw = Σᵤ nᵤ(N) / MTBFᵤ</text><rect x="330" y="122" width="300" height="58" rx="8" class="bx"/><text x="340" y="140" class="b">硬件中断：MTTR_hw</text><text x="340" y="159" class="t2">Σᵢ (λᵢ/λ_hw) · Σ_path P · T(path)</text><rect x="646" y="122" width="300" height="58" rx="8" class="bx"/><text x="656" y="140" class="b">其他事件类（各自 MTBFₖ、MTTRₖ）</text><text x="656" y="159" class="t2">隔离 · 已检出静默错误 · 误报；φ_SDC</text><rect x="14" y="210" width="300" height="76" rx="8" class="bx"/><text x="24" y="228" class="b">硬件单元 MTBFᵤ = 10⁹ / FITᵤ</text><text x="24" y="247" class="t2">NPU · 节点 · CPU · 机柜 · 作业级服务</text><text x="24" y="264" class="t2">UB / RoCE 交换芯片与光链路</text><rect x="330" y="210" width="300" height="76" rx="8" class="bx"/><text x="340" y="228" class="b">机制与恢复参数</text><text x="340" y="247" class="t2">检测 t_det = c·t_fast + (1 − c)·t_timeout</text><text x="340" y="264" class="t2">局部梯级：网络切换 · 重执行 · 弹性 · 进程</text><text x="340" y="281" class="t2">全局恢复 t_auto + (1 − s)·t_manual</text><rect x="646" y="210" width="300" height="76" rx="8" class="bx"/><text x="656" y="228" class="b">要求（降额设计约束）</text><text x="656" y="247" class="t2">MTTR_hw [s] / MTBF_hw [h] ≤ B</text><text x="656" y="264" class="t2">B = 3600·((1 − φ)/A* − 1) − F</text><text x="656" y="281" class="t2">F = Σₖ 3600·MTTRₖ/MTBFₖ（秒/小时）</text><line x1="420" y1="92" x2="164" y2="116" class="arr"/><path d="M159 114 L164 122 L169 114 Z" class="arrh"/><line x1="480" y1="92" x2="480" y2="116" class="arr"/><path d="M475 114 L480 122 L485 114 Z" class="arrh"/><line x1="540" y1="92" x2="796" y2="116" class="arr"/><path d="M791 114 L796 122 L801 114 Z" class="arrh"/><line x1="164" y1="180" x2="164" y2="204" class="arr"/><path d="M159 202 L164 210 L169 202 Z" class="arrh"/><line x1="480" y1="180" x2="480" y2="204" class="arr"/><path d="M475 202 L480 210 L485 202 Z" class="arrh"/><line x1="796" y1="180" x2="796" y2="204" class="arr"/><path d="M791 202 L796 210 L801 202 Z" class="arrh"/></svg>